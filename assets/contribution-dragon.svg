<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">Cyber Dragon and Python Snake</title>
  <desc id="desc">An animated cyber dragon and a snake move across a glowing contribution grid, with Linux and Python-inspired symbols.</desc>
  <defs>
