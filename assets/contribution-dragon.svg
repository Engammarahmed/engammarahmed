<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Python Snake: Charts to Wi-Fi</title>
  <desc id="desc">A neon green Python-inspired snake slides down from a glowing analytics chart and curls into a wireless network signal on a dark cyber background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070b16"/><stop offset="1" stop-color="#101b32"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a3ff68"/><stop offset=".55" stop-color="#22c55e"/><stop offset="1" stop-color="#00d4a6"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00d4ff"/><stop offset="1" stop-color="#647dff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1d4560" stroke-width=".7" opacity=".45"/>
    </pattern>
  </defs>
  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="18" fill="url(#grid)"/>
  <path d="M25 55H975M25 250H975" stroke="#17344d" stroke-width="1"/>
  <text x="34" y="34" fill="#00d4ff" font-family="monospace" font-size="14" letter-spacing="3">PYTHON // DATA IN MOTION</text>
  <text x="966" y="34" text-anchor="end" fill="#7893ad" font-family="monospace" font-size="11">CHARTS → NETWORK</text>

  <!-- Analytics chart -->
  <g transform="translate(105 74)">
    <rect width="270" height="145" rx="12" fill="#0b1425" stroke="#24516b" stroke-width="1.5"/>
    <text x="18" y="24" fill="#a7c7dc" font-family="monospace" font-size="11">LIVE CONTRIBUTIONS</text>
    <path d="M22 112H247M22 82H247M22 52H247" stroke="#1b3850" stroke-width="1" stroke-dasharray="3 5"/>
    <rect x="32" y="82" width="22" height="30" rx="3" fill="#166534"/>
    <rect x="66" y="62" width="22" height="50" rx="3" fill="#15803d"/>
    <rect x="100" y="70" width="22" height="42" rx="3" fill="#22c55e"/>
    <rect x="134" y="42" width="22" height="70" rx="3" fill="#4ade80"/>
    <rect x="168" y="30" width="22" height="82" rx="3" fill="#86efac"/>
    <path d="M34 70L77 49L111 56L145 31L179 20L220 35" fill="none" stroke="url(#cyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <g fill="#d5f7ff">
      <circle cx="34" cy="70" r="3"/><circle cx="77" cy="49" r="3"/><circle cx="111" cy="56" r="3"/><circle cx="145" cy="31" r="3"/><circle cx="179" cy="20" r="3"/><circle cx="220" cy="35" r="3"/>
    </g>
    <path d="M220 35l-9 -2 5 8" fill="none" stroke="#00d4ff" stroke-width="2"/>
  </g>

  <!-- Animated snake descends from the chart and travels toward the Wi-Fi signal -->
  <g filter="url(#glow)">
    <path d="M324 92 C353 104 338 132 357 148 S390 169 414 155 S450 140 470 164 S500 193 530 179 S562 158 590 174"
          fill="none" stroke="#062d20" stroke-width="23" stroke-linecap="round"/>
    <path d="M324 92 C353 104 338 132 357 148 S390 169 414 155 S450 140 470 164 S500 193 530 179 S562 158 590 174"
          fill="none" stroke="url(#green)" stroke-width="15" stroke-linecap="round" stroke-dasharray="900" stroke-dashoffset="900">
      <animate attributeName="stroke-dashoffset" values="900;0;0" keyTimes="0;0.72;1" dur="5s" repeatCount="indefinite"/>
    </path>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 0" dur="5s" repeatCount="indefinite"/>
      <path d="M579 163 Q595 158 609 170 L620 180 L608 191 L591 188 L581 179 Z" fill="#a3ff68" stroke="#d9ffc3" stroke-width="1.5"/>
      <circle cx="606" cy="173" r="3.2" fill="#07111c"/>
      <circle cx="607" cy="172" r="1" fill="#fff"/>
      <path d="M619 181l10 2 -9 4" fill="none" stroke="#fb7185" stroke-width="2" stroke-linecap="round"/>
      <path d="M623 183l8 2" stroke="#fb7185" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Wi-Fi target -->
  <g transform="translate(770 170)" filter="url(#glow)">
    <circle cx="0" cy="0" r="63" fill="#061624" stroke="#164e63" stroke-width="1.5"/>
    <path d="M-51 -24 Q0 -69 51 -24" fill="none" stroke="url(#cyan)" stroke-width="7" stroke-linecap="round"/>
    <path d="M-35 -7 Q0 -38 35 -7" fill="none" stroke="url(#cyan)" stroke-width="7" stroke-linecap="round"/>
    <path d="M-18 10 Q0 -7 18 10" fill="none" stroke="url(#cyan)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="0" cy="29" r="7" fill="#a3ff68"/>
    <circle cx="0" cy="29" r="13" fill="none" stroke="#a3ff68" stroke-width="1.5" opacity=".65">
      <animate attributeName="r" values="9;22;9" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0;.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <path d="M640 185 Q680 220 713 190" fill="none" stroke="#00d4ff" stroke-width="2" stroke-dasharray="4 6" opacity=".8">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1s" repeatCount="indefinite"/>
  </path>
  <text x="240" y="242" text-anchor="middle" fill="#8ba7bd" font-family="monospace" font-size="12">DATA / CHARTS</text>
  <text x="770" y="258" text-anchor="middle" fill="#8ba7bd" font-family="monospace" font-size="12">WI-FI NETWORK</text>
  <text x="500" y="282" text-anchor="middle" fill="#b4c7d8" font-family="monospace" font-size="12" letter-spacing="1">FOLLOW THE SNAKE • TRACE THE SIGNAL • KEEP BUILDING</text>
</svg>