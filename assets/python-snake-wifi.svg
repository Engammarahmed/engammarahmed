<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
<title id="title">Python snake travels from charts into Wi-Fi</title>
<desc id="desc">A bright green animated snake slithers down from an analytics chart and moves into a glowing wireless network symbol on a dark cyber-themed background.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060b16"/><stop offset="1" stop-color="#101d35"/></linearGradient>
  <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9ff7a"/><stop offset=".45" stop-color="#39e66a"/><stop offset="1" stop-color="#00d5a8"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#17405a" stroke-width=".8" opacity=".5"/></pattern>
</defs>
<rect width="1000" height="320" rx="20" fill="url(#bg)"/><rect width="1000" height="320" rx="20" fill="url(#grid)"/>
<text x="32" y="35" fill="#00d4ff" font-family="monospace" font-size="15" letter-spacing="3">LINUX &amp; PYTHON // CONTRIBUTION HUNT</text>
<!-- chart -->
<g transform="translate(80 76)">
 <rect width="280" height="155" rx="13" fill="#0b1425" stroke="#23617b" stroke-width="2"/>
 <text x="18" y="24" fill="#b7d8e8" font-family="monospace" font-size="12">DATA / CONTRIBUTIONS</text>
 <path d="M22 126H258M22 94H258M22 62H258" stroke="#254056" stroke-dasharray="4 5"/>
 <rect x="32" y="94" width="24" height="32" rx="3" fill="#0e6a3a"/><rect x="70" y="76" width="24" height="50" rx="3" fill="#168c45"/><rect x="108" y="58" width="24" height="68" rx="3" fill="#22c55e"/><rect x="146" y="39" width="24" height="87" rx="3" fill="#4ade80"/><rect x="184" y="51" width="24" height="75" rx="3" fill="#86efac"/><rect x="222" y="30" width="24" height="96" rx="3" fill="#a3ff68"/>
 <path d="M34 84L82 65L120 47L158 29L196 40L234 20" fill="none" stroke="#00d4ff" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
 <circle cx="234" cy="20" r="4" fill="#fff"/>
</g>
<!-- network target -->
<g transform="translate(795 171)" filter="url(#glow)">
 <circle r="72" fill="#071522" stroke="#14506a" stroke-width="2"/>
 <path d="M-51 -25Q0 -72 51 -25M-34 -7Q0 -39 34 -7M-17 11Q0 -5 17 11" fill="none" stroke="#00d4ff" stroke-width="8" stroke-linecap="round"/>
 <circle cy="31" r="8" fill="#a3ff68"/>
 <circle cy="31" r="13" fill="none" stroke="#a3ff68" stroke-width="2"><animate attributeName="r" values="10;26;10" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1.8s" repeatCount="indefinite"/></circle>
</g>
<!-- moving snake group: it travels down from the chart, curves across, and reaches Wi-Fi -->
<g filter="url(#glow)">
 <path d="M335 122 C360 142 335 165 362 181 S404 206 433 185 S474 164 496 191 S538 219 565 195 S610 174 635 195 S682 209 716 182"
       fill="none" stroke="#052e20" stroke-width="27" stroke-linecap="round"/>
 <path d="M335 122 C360 142 335 165 362 181 S404 206 433 185 S474 164 496 191 S538 219 565 195 S610 174 635 195 S682 209 716 182"
       fill="none" stroke="url(#snake)" stroke-width="19" stroke-linecap="round" stroke-dasharray="4 1"/>
 <g>
   <animateTransform attributeName="transform" type="translate" values="-36 -30;0 0;28 6;0 0;-36 -30" keyTimes="0;.35;.72;.9;1" dur="5s" repeatCount="indefinite"/>
   <path d="M700 164 Q721 153 741 170 L753 182 L739 195 L717 191 L704 181Z" fill="url(#snake)" stroke="#d9ffc3" stroke-width="1.5"/>
   <circle cx="735" cy="173" r="3.5" fill="#07111c"/><circle cx="736" cy="172" r="1.1" fill="#fff"/>
   <path d="M750 183l12 2 -10 5" fill="none" stroke="#fb7185" stroke-width="2.4" stroke-linecap="round"/>
   <path d="M716 165l-5 -8 10 5" fill="#a3ff68"/>
 </g>
</g>
<path d="M374 242Q550 273 704 225" fill="none" stroke="#00d4ff" stroke-width="2" stroke-dasharray="5 8" opacity=".8"><animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.2s" repeatCount="indefinite"/></path>
<text x="220" y="257" text-anchor="middle" fill="#9bb5c8" font-family="monospace" font-size="13">CHARTS</text>
<text x="795" y="270" text-anchor="middle" fill="#9bb5c8" font-family="monospace" font-size="13">WI-FI NETWORK</text>
<text x="500" y="300" text-anchor="middle" fill="#c7d6e5" font-family="monospace" font-size="12" letter-spacing="1">FOLLOW THE SNAKE • TRACE THE SIGNAL</text>
</svg>