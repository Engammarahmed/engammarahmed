<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
<title id="title">Python snake climbs chart steps, circles Wi-Fi, and jumps back</title>
<desc id="desc">A neon green snake moves down chart steps, eats glowing energy orbs, grows longer with each bite, circles the Wi-Fi symbol, and jumps back to the chart.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060b16"/><stop offset="1" stop-color="#101d35"/></linearGradient>
<linearGradient id="snake" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9ff7a"/><stop offset=".5" stop-color="#39e66a"/><stop offset="1" stop-color="#00d5a8"/></linearGradient>
<linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00d4ff"/><stop offset="1" stop-color="#647dff"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#17405a" stroke-width=".8" opacity=".45"/></pattern>
</defs>
<rect width="1000" height="320" rx="20" fill="url(#bg)"/><rect width="1000" height="320" rx="20" fill="url(#grid)"/>
<text x="32" y="35" fill="#00d4ff" font-family="monospace" font-size="15" letter-spacing="3">LINUX &amp; PYTHON // CONTRIBUTION HUNT</text>
<g>
<rect x="76" y="65" width="390" height="190" rx="14" fill="#0b1425" stroke="#23617b" stroke-width="1.5"/>
<text x="96" y="88" fill="#b7d8e8" font-family="monospace" font-size="12">CONTRIBUTION CHART</text>
<path d="M96 120H446M96 160H446M96 200H446M96 240H446" stroke="#254056" stroke-dasharray="4 5"/>
<rect x="112" y="110" width="38" height="130" rx="4" fill="#0c6737"/><rect x="158" y="132" width="38" height="108" rx="4" fill="#138441"/><rect x="204" y="154" width="38" height="86" rx="4" fill="#22a852"/><rect x="250" y="176" width="38" height="64" rx="4" fill="#39c765"/><rect x="296" y="198" width="38" height="42" rx="4" fill="#5be47d"/><rect x="342" y="218" width="38" height="22" rx="4" fill="#a3ff68"/>
<path d="M130 105L176 127L222 149L268 171L314 193L360 213" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
<circle cx="130" cy="105" r="3" fill="#fff"/><circle cx="176" cy="127" r="3" fill="#fff"/><circle cx="222" cy="149" r="3" fill="#fff"/><circle cx="268" cy="171" r="3" fill="#fff"/><circle cx="314" cy="193" r="3" fill="#fff"/><circle cx="360" cy="213" r="3" fill="#fff"/>
</g>
<g transform="translate(790 164)" filter="url(#glow)">
<circle r="78" fill="#071522" stroke="#14506a" stroke-width="2"/><circle r="66" fill="none" stroke="#0c3b52" stroke-dasharray="3 7"/>
<path d="M-52 -25Q0 -73 52 -25M-35 -7Q0 -40 35 -7M-18 11Q0 -6 18 11" fill="none" stroke="url(#cyan)" stroke-width="8" stroke-linecap="round"/>
<circle cy="31" r="8" fill="#a3ff68"/><circle cy="31" r="14" fill="none" stroke="#a3ff68" stroke-width="2"><animate attributeName="r" values="10;25;10" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0;.9" dur="1.8s" repeatCount="indefinite"/></circle>
</g>
<path d="M130 98 L130 110 L176 110 L176 132 L222 132 L222 154 L268 154 L268 176 L314 176 L314 198 L360 198 L360 218 C430 270 490 252 530 205 C570 158 612 143 657 163 C690 178 705 204 736 204 C770 204 813 188 825 158 C836 130 803 115 782 136 C761 158 781 189 807 185 C837 181 844 148 823 133 C800 118 771 145 783 168 C796 191 827 180 828 159 C829 135 802 126 785 143 C765 164 789 193 812 185 C838 176 831 144 809 139 C770 130 733 153 704 185 C669 222 620 219 579 189 C538 159 503 163 472 201 C438 243 400 255 360 218 L360 198 L314 198 L314 176 L268 176 L268 154 L222 154 L222 132 L176 132 L176 110 L130 110 L130 98" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="3 8" opacity=".45"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="2s" repeatCount="indefinite"/></path>
<g filter="url(#glow)">
<g>
<animateMotion dur="14s" repeatCount="indefinite" rotate="auto" path="M130 98 L130 110 L176 110 L176 132 L222 132 L222 154 L268 154 L268 176 L314 176 L314 198 L360 198 L360 218 C430 270 490 252 530 205 C570 158 612 143 657 163 C690 178 705 204 736 204 C770 204 813 188 825 158 C836 130 803 115 782 136 C761 158 781 189 807 185 C837 181 844 148 823 133 C800 118 771 145 783 168 C796 191 827 180 828 159 C829 135 802 126 785 143 C765 164 789 193 812 185 C838 176 831 144 809 139 C770 130 733 153 704 185 C669 222 620 219 579 189 C538 159 503 163 472 201 C438 243 400 255 360 218 L360 198 L314 198 L314 176 L268 176 L268 154 L222 154 L222 132 L176 132 L176 110 L130 110 L130 98"/>
<path d="M-42 0 C-30 -16 -15 -16 0 0 S28 16 42 0" fill="none" stroke="#073e2b" stroke-width="22" stroke-linecap="round"/>
<path d="M-42 0 C-30 -16 -15 -16 0 0 S28 16 42 0" fill="none" stroke="url(#snake)" stroke-width="15" stroke-linecap="round"/>
<path d="M27 -4 Q39 -16 52 -6 L61 1 L53 12 L38 10 L29 4Z" fill="url(#snake)" stroke="#d9ffc3" stroke-width="1.5"/>
<circle cx="49" cy="-4" r="2.6" fill="#07111c"/><circle cx="49.5" cy="-4.5" r=".9" fill="#fff"/>
<path d="M60 2l9 2 -8 4" fill="none" stroke="#fb7185" stroke-width="1.8" stroke-linecap="round"/>
<path d="M-19 -7l-5 -7 10 4 M7 7l-4 8 10 -4" fill="#a3ff68"/>
<!-- Body segments appear one by one as the snake eats glowing food -->
<g stroke="#baff9a" stroke-width="1.2">
  <circle cx="-53" cy="0" r="9" fill="#39e66a" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.12;1" begin="2s" dur="12s" repeatCount="indefinite"/></circle>
  <circle cx="-70" cy="0" r="9.5" fill="#39e66a" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.2;1" begin="3s" dur="11s" repeatCount="indefinite"/></circle>
  <circle cx="-88" cy="0" r="10" fill="#39e66a" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.25;1" begin="4s" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="-107" cy="0" r="10.5" fill="#39e66a" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.3;1" begin="5s" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="-127" cy="0" r="11" fill="#39e66a" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.35;1" begin="6s" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="-148" cy="0" r="11.5" fill="#39e66a" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.4;1" begin="7s" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="-170" cy="0" r="12" fill="#39e66a" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.45;1" begin="8s" dur="6s" repeatCount="indefinite"/></circle>
</g>
</g>
</g>
<text x="270" y="280" text-anchor="middle" fill="#9bb5c8" font-family="monospace" font-size="12">1. SLITHER DOWN THE CHART</text><text x="790" y="270" text-anchor="middle" fill="#9bb5c8" font-family="monospace" font-size="12">2. CIRCLE WI-FI</text><text x="500" y="305" text-anchor="middle" fill="#c7d6e5" font-family="monospace" font-size="12" letter-spacing="1">3. JUMP BACK TO THE CHART • REPEAT</text>
</svg>